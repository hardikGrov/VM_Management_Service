[project]
name = "vm-management-service"
version = "0.1.0"
description = "FastAPI service for VM lifecycle management."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "openstacksdk>=3.0.0",
    "pydantic-settings>=2.3.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "app/repositories/openstack_adapter.py",
    "app/repositories/openstack_vm_repository.py",
]
